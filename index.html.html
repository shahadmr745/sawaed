<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة رمضان</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            text-align: center;
            direction: rtl;
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .greeting-card {
            position: relative;
            display: inline-block;
            width: 400px;
            height: auto;
        }
        .greeting-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>أدخل اسمك للحصول على تهنئة رمضان</h2>
        <input type="text" id="nameInput" placeholder="اكتب اسمك هنا" />
        <button onclick="generateGreeting()">عرض التهنئة</button>
        <br><br>
        <div class="greeting-card" id="greetingCard" style="display: none;">
            <canvas id="canvas"></canvas>
        </div>
        <br>
        <button id="downloadButton" style="display: none;" onclick="downloadImage()">تحميل الصورة</button>
    </div>
    
    <script>
        function generateGreeting() {
            let name = document.getElementById("nameInput").value.trim();
            if (name === "") {
                alert("يرجى إدخال الاسم أولاً!");
                return;
            }

            let canvas = document.getElementById("canvas");
            let ctx = canvas.getContext("2d");
            let img = new Image();
            img.crossOrigin = "anonymous";
            img.src = "https://i.postimg.cc/XqRWtLvs/image.png";

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                let fontSize = Math.min(30, canvas.width / (name.length * 1.5));
                ctx.font = fontSize + "px 'IBM Plex Sans Arabic', sans-serif";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText(name, canvas.width / 2, canvas.height - 100);
                
                document.getElementById("greetingCard").style.display = "block";
                document.getElementById("downloadButton").style.display = "block";
            };
        }

        function downloadImage() {
            let canvas = document.getElementById("canvas");
            let link = document.createElement("a");
            link.download = "تهنئة_رمضان.png";
            link.href = canvas.toDataURL("image/png");
            link.click();
        }
    </script>
</body>
</html>
